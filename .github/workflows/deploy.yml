name: deploy
# Builds and tests every push. Pull requests and branches get a preview version;
# the default branch (whatever it is named; this repo has no `main`) deploys to production. Secrets are repository secrets that Liam adds:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional repository variable HM_API_URL points the build at a backend.
# HM_CLERK_KEY (Landnam's Clerk publishable key, public) turns on Clerk sign-in.
on:
  push:
  pull_request:

# Daily delivery shares this group so two production deploys never overlap.
concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./engine ./physics ./game ./client ./runcheck
      - run: go test ./engine ./physics ./game ./runcheck
      - run: scripts/build-dist.sh
        env:
          # Public values; the repository variables override them. Without a default, a missing variable silently ships the no-backend demo.
          HM_API_URL: ${{ vars.HM_API_URL || 'https://signal-k-pocketbase.fly.dev' }}
          HM_CLERK_KEY: ${{ vars.HM_CLERK_KEY || 'pk_live_Y2xlcmsucGxheWxhbmRuYW0uc3BhY2Uk' }}
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip until the Cloudflare secrets exist
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not set; build and tests passed, nothing deployed."
      - uses: actions/checkout@v4
        if: ${{ env.CF_TOKEN != '' }}
      - uses: actions/download-artifact@v4
        if: ${{ env.CF_TOKEN != '' }}
        with: { name: dist, path: dist }
      # The first ever deploy must come from the default branch: `versions upload` needs the Worker to exist.
      - name: Production (default branch) or preview version (other branches)
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Assets-only Workers (no `main`) need a recent wrangler; the action default is older.
          wranglerVersion: "4"
          command: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'deploy' || 'versions upload' }}
