name: Component tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      visual: ${{ steps.filter.outputs.visual }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/tests.yml'
            visual:
              - 'game/**'
              - 'engine/**'
              - 'physics/**'
              - 'cmd/wasm/**'
              - 'client/**'
              - 'web/**'
              - 'tests/visual/**'
              - 'scripts/build-dist.sh'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/tests.yml'
            backend:
              - 'cmd/server/**'
              - 'migrations/**'
              - 'web/**'
              - 'tests/container/backend_smoke.py'
              - 'scripts/build-dist.sh'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/tests.yml'
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev
      - run: go vet ./engine ./physics ./game ./client
      - run: go test ./...
  browser-and-backend:
    needs: changes
    if: needs.changes.outputs.visual == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.visual == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - run: scripts/build-dist.sh
        env:
          HM_BUILD_ID: ci-test
      - name: Backend smoke test
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          go build -o /tmp/haphazard-server ./cmd/server
          python3 tests/container/backend_smoke.py
      - name: Visual scene tests
        if: needs.changes.outputs.visual == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          CHROMIUM_PATH=$(node -p "require('playwright').chromium.executablePath()") node tests/visual/scenes.cjs
      - uses: actions/upload-artifact@v4
        if: always() && (needs.changes.outputs.visual == 'true' || github.event_name == 'workflow_dispatch')
        with:
          name: visual-scenes
          path: test-results/visual/
          if-no-files-found: ignore
